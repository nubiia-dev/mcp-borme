name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: @semantic-release/npm exchanges the job's OIDC identity (id-token: write)
          # for a short-lived publish credential via the package's npm Trusted Publisher
          # (nubiia-dev/mcp-borme, workflow release.yml). Provenance stays enabled below.
          # TODO: temporary bootstrap for the first publish (the package does not exist on npm yet, so
          # no Trusted Publisher can be configured). Revert this line, and delete the NPM_TOKEN
          # secret, after 1.0.0 is published and the Trusted Publisher is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release

      # El tag lo crea semantic-release con GITHUB_TOKEN, y GitHub no dispara
      # workflows con eventos generados por su propio token: publish-mcp.yml
      # nunca arrancaría solo. Por eso la publicación al registro se encadena
      # aquí, condicionada a que esta ejecución haya publicado algo.
      - name: Download MCP Publisher
        if: steps.release.outputs.released == 'true'
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Authenticate with MCP Registry (OIDC)
        if: steps.release.outputs.released == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.release.outputs.released == 'true'
        run: ./mcp-publisher publish
